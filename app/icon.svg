<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1528" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="bullishGrad" x1="0" y1="0" x2="0" y2="100%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="bearishGrad" x1="0" y1="0" x2="0" y2="100%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#10b981" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="180" height="180" rx="38" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />

  <!-- Candlestick 1: Green Bullish (Left) -->
  <line x1="48" y1="36" x2="48" y2="144" stroke="#10b981" stroke-width="5" stroke-linecap="round" />
  <rect x="35" y="64" width="26" height="52" rx="5" fill="url(#bullishGrad)" stroke="#34d399" stroke-width="2" />

  <!-- Candlestick 2: Red Bearish (Middle) -->
  <line x1="90" y1="46" x2="90" y2="152" stroke="#ef4444" stroke-width="5" stroke-linecap="round" />
  <rect x="77" y="74" width="26" height="46" rx="5" fill="url(#bearishGrad)" stroke="#f87171" stroke-width="2" />

  <!-- Candlestick 3: Strong Bullish Breakout (Right) -->
  <line x1="132" y1="24" x2="132" y2="130" stroke="#10b981" stroke-width="5" stroke-linecap="round" />
  <rect x="119" y="40" width="26" height="60" rx="5" fill="url(#bullishGrad)" stroke="#34d399" stroke-width="2" filter="url(#glow)" />
</svg>